# Houdt het gratis Supabase-project wakker: elke dag één kleine vraag aan de databank.
# Leest de URL en publieke sleutel uit config.js (die zijn sowieso publiek).
name: Supabase wakker houden
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping
        run: |
          URL=$(grep -oP "supabaseUrl:\s*'\K[^']+" config.js || true)
          KEY=$(grep -oP "supabaseKey:\s*'\K[^']+" config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config.js nog niet ingevuld — niets te doen"; exit 0; fi
          curl -sS --fail -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
